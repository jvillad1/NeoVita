ktor {
    deployment {
        port = 8080
        port = ${?PORT}          # Railway injects PORT; falls back to 8080 locally
    }
    application { modules = [ com.neovita.server.ApplicationKt.module ] }
}

database {
    url = ${?DB_URL}           # JDBC URL: jdbc:postgresql://host:5432/neovita?user=..&password=..
    driver = "org.postgresql.Driver"
}

jwt {
    secret = ${?JWT_SECRET}
    issuer = "neovita"
    audience = "neovita-app"
    expirationMs = 86400000   # 24h
}

google {
    clientId = ${?GOOGLE_CLIENT_ID}   # OAuth Web Client ID (Google Cloud Console); enables aud check + web sign-in
    clientIdIos = ${?GOOGLE_CLIENT_ID_IOS}   # OAuth iOS Client ID — Google emite otro `aud` para iOS
}

appConfig {
    features = ""             # e.g. "chat=true,healthSync=false" — see server/config/AppRuntimeConfig.kt
    features = ${?APP_FEATURES}
    minVersionAndroid = 0     # versionCode below this → "Actualiza la app" gate
    minVersionAndroid = ${?MIN_VERSION_ANDROID}
    minVersionIos = 0
    minVersionIos = ${?MIN_VERSION_IOS}
    maintenance = false
    maintenance = ${?MAINTENANCE_MODE}
    firebaseApiKey = ${?FIREBASE_API_KEY}         # Firebase client values (console → project settings);
    firebaseAppId = ${?FIREBASE_APP_ID}           # all four present => installed apps activate push,
    firebaseProjectId = ${?FIREBASE_PROJECT_ID}   # no release needed. Not secrets.
    firebaseSenderId = ${?FIREBASE_SENDER_ID}
}

claude {
    apiKey = ${?CLAUDE_API_KEY}
    model = "claude-sonnet-4-6"
}

push {
    serviceAccount = ${?FIREBASE_SERVICE_ACCOUNT}   # service-account JSON (secret); absent = sending disabled
}
