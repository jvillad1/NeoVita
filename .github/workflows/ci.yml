name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "enhancement/**"
      - "fix/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Compile Android + run Android Lint ─────────────────────────────
  android-build:
    name: Android — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Android Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

  # ── Job 2: Unit tests (server + core JVM) ─────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :server:test :core:testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 14

  # ── Job 3: core + shared commonMain compile for Android target ───────────
  # Ojo: esto valida commonMain, NO los `actual` de cada plataforma. iOS y wasm
  # tienen sus propios jobs abajo — precisamente porque iOS estuvo meses sin
  # compilar y nadie se enteró (ver PR #13).
  kmp-shared:
    name: KMP — Shared module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile core + shared modules (Android target)
        run: ./gradlew :core:compileDebugKotlinAndroid :core:compileReleaseKotlinAndroid :shared:compileDebugKotlinAndroid :shared:compileReleaseKotlinAndroid

  # ── Job 4: WasmJS (web) ──────────────────────────────────────────────────
  # El plugin de Kotlin descarga su propio Node; no hace falta setup-node.
  wasm-build:
    name: Web — WasmJS distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build production web bundle
        run: ./gradlew :webApp:wasmJsBrowserDistribution

  # ── Job 5: iOS — compila, enlaza Y arranca ───────────────────────────────
  # Los tres bloqueos que tuvo iOS sólo se ven en etapas distintas:
  #   libsqlite3 sin enlazar  -> falla en xcodebuild (no en compileKotlinIos*)
  #   Info.plist incompleto   -> sólo al ARRANCAR (excepción de Compose)
  #   recursos sin copiar     -> sólo al ARRANCAR (MissingResourceException)
  # Por eso este job llega hasta lanzar la app en el simulador.
  ios-build:
    name: iOS — Build & smoke test
    runs-on: macos-15
    # Los runners macOS cuestan 10x: sólo en PRs a main y en main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile the iOS target
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64

      - name: Assemble the ComposeApp XCFramework
        run: ./gradlew :shared:assembleComposeAppDebugXCFramework

      - name: Build the iOS app (linking + resources)
        working-directory: iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Assert the bundle carries the Compose resources
        working-directory: iosApp
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/iosApp.app"
          test -d "$APP" || { echo "::error::no se generó $APP"; exit 1; }
          COUNT=$(find "$APP/compose-resources" -name '*.ttf' 2>/dev/null | wc -l | tr -d ' ')
          echo "fuentes empaquetadas: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::el bundle no lleva las fuentes de Compose (la app moriría al arrancar)"
            exit 1
          fi

      - name: Smoke test — la app arranca sin excepciones
        working-directory: iosApp
        run: |
          set -e
          APP="build/Build/Products/Debug-iphonesimulator/iosApp.app"
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r in d for x in d[r] if 'iPhone' in x['name']))")
          echo "simulador: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch --console-pty "$DEVICE" com.neovita.app > launch.log 2>&1 &
          sleep 30
          echo "----- salida de la app -----"
          cat launch.log || true
          if grep -q "Uncaught Kotlin exception" launch.log; then
            echo "::error::la app crasheó al arrancar"
            exit 1
          fi

      - name: Upload iOS launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-log
          path: iosApp/launch.log
          retention-days: 7
