name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "enhancement/**"
      - "fix/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Compile Android + run Android Lint ─────────────────────────────
  android-build:
    name: Android — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Android Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

  # ── Job 2: Unit tests (server + core JVM) ─────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :server:test :core:testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 14

  # ── Job 3: core + shared commonMain compile for Android target ───────────
  # iOS requires macOS + Xcode; WasmJS requires Node toolchain.
  # Android compilation already validates all commonMain sources.
  kmp-shared:
    name: KMP — Shared module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile core + shared modules (Android target)
        run: ./gradlew :core:compileDebugKotlinAndroid :core:compileReleaseKotlinAndroid :shared:compileDebugKotlinAndroid :shared:compileReleaseKotlinAndroid
